name: Code Formatting Check

on:
  pull_request:
    branches:
      - main

jobs:
  black:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black
      
      - name: Check code formatting with Black
        run: |
          black --check --diff .
      
      - name: Formatting check summary
        if: failure()
        run: |
          echo "❌ Code formatting check failed!"
          echo "Please run 'black .' to format your code before committing."
          echo "Or run 'black --check --diff .' to see what needs to be changed."
